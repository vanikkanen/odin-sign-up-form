<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="page-container">
        <div class="left-side-container">
            <div class="logo-container">
                <img class="logo-image" src="./resources/odin-lined.png">
                <span class="logo-text">ODIN</span>
            </div>
            <div class="credit-container">Photo by <a class="credit-link" href="">Daniel Boberg</a> on <a class="credit-link" href="">Unsplash</a></div>
        </div>

        <div class="content-container">
            <header class="signup-form-header">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. <br> Sign up <i>now</i> to get started.</p>
                <p>You <i>know</i> you want to.</p> 
            </header>
        
            <form id="signup-form" action='' method='post' class="signup-form">
                <legend>Let's do this!</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">FIRST NAME</label>
                        <input id="first-name" name="first-name" type="text"/>    
                    </div>
                    <div class="form-group">
                        <label for="last-name">LAST NAME</label>
                        <input id="last-name" name="last-name" type="text"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="user-email">EMAIL</label>
                        <input id="user-email" name="user-email" type="email"/>    
                    </div>
                    <div class="form-group">
                        <label for="user-phone-number">PHONE NUMBER</label>
                        <input id="user-phone-number" name="user-phone-number" type="tel"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="user-password">PASSWORD</label>
                        <input id="user-password" name="user-password" type="password" required/>
                        
                    </div>
                    <div class="form-group">
                        <label for="user-password-confirmation">CONFIRM PASSWORD</label>
                        <input id="user-password-confirmation" name="user-password-confirmation" type="password" required/>
                    </div>
                </div>
            </form>

            <div class="submit-container">
                <input class="submit-button" type="submit" form="signup-form" value="Create Account" />
                <div class="login-content">Already have an account? <a class="login-link" href="">Log in</a></div>
            </div>
        </div>

    </div>
</body>
</html>
